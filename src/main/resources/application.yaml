server:
  port: ${SERVER_PORT:8079}
spring:
  application:
    name: product-service
  profiles:
    active: ${ACTIVE_PROFILE:local}
  datasource:
    url: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        # No __TypeId__ header with product_service class names: order_service decides the type
        spring.json.add.type.headers: false
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # order_service sends no __TypeId__ header → always deserialize into our own event class
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.khoilnm.dto.event.OrderCreatedEvent

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Register the IP instead of the machine hostname (the hostname may not resolve from other services)
    prefer-ip-address: true
